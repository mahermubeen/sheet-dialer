<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Dialer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dialer.css') }}">
</head>
<body>
<header>
  <h1>📞 Sheet Dialer</h1>
  <label title="Which tab of leads.xlsx to call from">Sheet <select id="sheet"></select></label>
  <label>Queue
    <select id="status">
      <option value="new">New (not called)</option>
      <option value="followup">Follow-ups due</option>
      <option value="Interested">Interested</option>
      <option value="all">All</option>
    </select>
  </label>
  <label>Country <select id="country"><option value="">All</option></select></label>
  <label title="After saving, automatically dial the next lead after a countdown"><input type="checkbox" id="autodial"> Auto-dial next in <input id="delay" type="number" value="5" min="2" style="width:52px">s</label>
  <div class="searchbox">
    <input id="search" class="nosave" type="search" placeholder="Search name, phone, city, owner… (/)" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="ghost" onclick="openTable()">📋 All leads (L)</button>
  <div class="stats" id="stats"></div>
</header>

<div class="tableview" id="tableview" hidden>
  <div class="bar">
    <b style="font-size:17px">All leads · <span id="tsheet"></span></b>
    <input id="tfilter" class="nosave" type="search" placeholder="Filter name, phone, city, owner…" style="width:280px" autocomplete="off">
    <select id="tstatus"></select>
    <span class="muted" id="tcount"></span>
    <button class="ghost" style="margin-left:auto" onclick="closeTable()">✕ Close (Esc)</button>
  </div>
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="zpanel" id="zpanel" hidden>
  <div class="zhead" onclick="this.parentNode.classList.toggle('min')"><span>Zoom Phone</span><span class="muted">show / hide</span></div>
  <iframe id="zoom-embeddable-phone-iframe" title="Zoom Phone"
    allow="microphone; camera; clipboard-read; clipboard-write https://applications.zoom.us"></iframe>
</div>

<script>window.DIALER_CONFIG = {{ config|tojson }};</script>
<script src="{{ url_for('static', filename='dialer.js') }}"></script>
</body>
</html>
